<svg xmlns="http://www.w3.org/2000/svg" width="920" height="488" viewBox="0 0 920 488" role="img" aria-label="gitmsg reads a staged greeting and farewell, spins Generating on one line, then types git commit -m &quot;Adds farewell &amp; updates the greeting&quot; onto the prompt and waits. Nothing is committed.">
<defs>
<style>
text{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
.dim{fill:#6e6a82}
.ink{fill:#e8e6f2}
.hot{fill:#ff2a6d}
.ice{fill:#29f0ff}
.leaf{fill:#3dff9a}
.amber{fill:#f6c445}
.beat{animation:8s step-end infinite}
.caret{animation:blink 1.05s steps(1) infinite}
@keyframes a0{0%{visibility:visible}12.5%{visibility:hidden}100%{visibility:hidden}}
@keyframes a1{0%{visibility:hidden}12.5%{visibility:visible}20%{visibility:hidden}100%{visibility:hidden}}
@keyframes a2{0%{visibility:hidden}20%{visibility:visible}27.5%{visibility:hidden}100%{visibility:hidden}}
@keyframes a3{0%{visibility:hidden}27.5%{visibility:visible}35%{visibility:hidden}100%{visibility:hidden}}
@keyframes a4{0%{visibility:hidden}35%{visibility:visible}42.5%{visibility:hidden}100%{visibility:hidden}}
@keyframes a5{0%{visibility:hidden}42.5%{visibility:visible}50%{visibility:hidden}100%{visibility:hidden}}
@keyframes a6{0%{visibility:hidden}50%{visibility:visible}57.5%{visibility:hidden}100%{visibility:hidden}}
@keyframes a7{0%{visibility:hidden}57.5%{visibility:visible}100%{visibility:visible}}
@keyframes blink{0%,46%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .beat{animation:none;visibility:hidden}
  .a7{visibility:visible}
  .caret{animation:none;opacity:1}
}
</style>
</defs>
<rect width="920" height="488" fill="#07060f"/>
<rect x="20" y="16" width="880" height="456" rx="18" fill="#0c0a16" stroke="#ff2a6d" stroke-opacity=".45"/>
<rect x="20" y="16" width="880" height="52" rx="18" fill="#120e1c"/>
<rect x="20" y="50" width="880" height="18" fill="#120e1c"/>
<circle cx="48" cy="42" r="6" fill="#ff2a6d"/>
<circle cx="70" cy="42" r="6" fill="#f6c445"/>
<circle cx="92" cy="42" r="6" fill="#3dff9a"/>
<text x="116" y="48" fill="#e8e6f2" font-size="15">gitmsg</text>
<text x="460" y="48" fill="#6e6a82" font-size="14" text-anchor="middle">~/app</text>
<text x="868" y="48" fill="#3dff9a" font-size="13" text-anchor="end">staged</text>
<text x="56" y="112" font-size="18"><tspan class="dim">On branch </tspan><tspan class="amber">main</tspan></text>
<text x="56" y="150" class="ink" font-size="18">Changes to be committed:</text>
<text x="56" y="188" font-size="18"><tspan class="amber">  modified:   </tspan><tspan class="ink">src/greeting.rs</tspan></text>
<text x="56" y="226" font-size="18"><tspan class="leaf">  new file:   </tspan><tspan class="ink">src/farewell.rs</tspan></text>
<g class="beat" style="animation-name:a0">
  <text x="56" y="300" font-size="20"><tspan class="hot">❯ </tspan><tspan class="ink">gitmsg</tspan><tspan class="caret hot">▍</tspan></text>
</g>
<g class="beat" style="animation-name:a1">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠋ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat" style="animation-name:a2">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠙ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat" style="animation-name:a3">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠹ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat" style="animation-name:a4">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠸ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat" style="animation-name:a5">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠼ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat" style="animation-name:a6">
  <text x="56" y="300" font-size="20"><tspan class="ice">⠴ </tspan><tspan class="dim">Generating</tspan></text>
</g>
<g class="beat a7" style="animation-name:a7">
  <text x="56" y="300" font-size="18"><tspan class="hot">❯ </tspan><tspan class="ink">git commit -m "</tspan><tspan class="amber">Adds</tspan><tspan class="ink"> farewell </tspan><tspan class="ice">&amp;</tspan><tspan class="ink"> updates the greeting"</tspan><tspan class="caret hot">▍</tspan></text>
</g>
<text x="56" y="430" class="dim" font-size="14">// the line waits. Enter is the only thing that commits.</text>
</svg>
